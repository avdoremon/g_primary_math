name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dart:
    name: Phân tích và test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Phiên bản Flutter
        run: flutter --version

      - name: Thư viện SQLite cho test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 libsqlite3-dev

      - name: Lấy package
        run: flutter pub get

      - name: Kiểm tra định dạng (chỉ cảnh báo)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Phân tích tĩnh
        shell: bash
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          code=$?
          # Mỗi lỗi/cảnh báo thành một annotation để đọc được qua GitHub API
          python3 - <<'PY'
          for line in open('analyze.txt', encoding='utf-8'):
              p = line.rstrip('\n').split('|')
              if len(p) < 8 or p[0] not in ('ERROR', 'WARNING', 'INFO'):
                  continue
              level = {'ERROR': 'error', 'WARNING': 'warning', 'INFO': 'notice'}[p[0]]
              path = p[3].split('/g_primary_math/')[-1]
              msg = '|'.join(p[7:]).replace('%', '%25').replace('\r', '').replace('\n', ' ')
              print(f'::{level} file={path},line={p[4]},col={p[5]},title={p[2]}::{msg}')
          PY
          exit $code

      - name: Unit test
        # Vẫn chạy test khi phân tích tĩnh báo lỗi, để thấy hết vấn đề trong một lần.
        if: success() || failure()
        shell: bash
        run: |
          set +e
          flutter test --file-reporter json:test-results.json --reporter github
          code=$?
          # Mỗi test thất bại thành một annotation có tên test và nội dung lỗi
          python3 - <<'PY'
          import json
          names, errors, prints = {}, {}, {}
          for line in open('test-results.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
              elif e.get('type') == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
          for tid, errs in errors.items():
              # Lỗi widget test (FlutterError) nằm trong phần in ra: lấy đoạn từ "EXCEPTION CAUGHT".
              log = '\n'.join(prints.get(tid, []))
              i = log.find('EXCEPTION CAUGHT')
              detail = log[i:i + 2500] if i >= 0 else ''
              msg = (' / '.join(errs)[:900] + ' || ' + detail).replace('%', '%25').replace('\r', '').replace('\n', ' ¶ ')
              print(f'::error title=TEST {names.get(tid, tid)}::{msg}')
          PY
          exit $code

  apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dựng project Android (setup.sh)
        run: bash setup.sh

      - name: Kiểm tra biểu tượng app
        run: python3 tool/check_icons.py

      - name: Khoá ký APK cố định (GitHub Secrets)
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=toanvandong\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties
            echo "::notice title=Khoá ký::APK ký bằng khoá cố định, cài đè được lên bản trước"
          else
            echo "::warning title=Chưa có khoá ký::Thiếu secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD: APK ký bằng khoá debug tạm, không cài đè được lên bản trước"
          fi

      - name: Build APK release
        shell: bash
        run: |
          set +e
          # Số phiên bản (versionCode) = số lần chạy CI, luôn tăng nên Android nhận là bản cập nhật.
          flutter build apk --release --build-number=${{ github.run_number }} > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            # Đưa các dòng lỗi Gradle/Kotlin thành annotation để đọc được qua GitHub API
            python3 - <<'PY'
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keys = ('error', 'Error', 'FAILURE', 'What went wrong', 'e: ', 'Could not', 'failed')
          keep = [l for l in lines if any(k in l for k in keys)][-60:]
          msg = ' ¶ '.join(keep or lines[-60:])[:8000].replace('%', '%25').replace('\r', '')
          print(f'::error title=BUILD APK::{msg}')
          PY
          fi
          exit $code

      - name: Kiểm tra APK có đủ lớp nhận diện
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          list=$(unzip -l "$apk")
          missing=""
          for f in assets/pose_landmarker_lite.task assets/pose_landmarker_full.task libmediapipe_tasks_vision_jni.so; do
            echo "$list" | grep -q "$f" || missing="$missing $f"
          done
          echo "$list" | grep -E "pose_landmarker|mediapipe.*\.so" || true
          grep -E "proguard|minify|R8" android/app/build.gradle* || true
          if [ -n "$missing" ]; then
            echo "::error title=APK thiếu lớp nhận diện::Không thấy:$missing"
            exit 1
          fi
          # Lớp Java của MediaPipe phải còn nguyên trong dex (R8 từng cắt bỏ → NoClassDefFoundError trên máy).
          tmp=$(mktemp -d); unzip -q -o "$apk" 'classes*.dex' -d "$tmp"
          for c in com/google/mediapipe/tasks/vision/poselandmarker/PoseLandmarker com/google/mediapipe/tasks/core/BaseOptions com/google/mediapipe/framework/image/BitmapImageBuilder com/google/protobuf/GeneratedMessageLite; do
            if ! cat "$tmp"/classes*.dex | grep -aq "L$c;"; then missing="$missing $c"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=APK thiếu lớp MediaPipe::Không thấy trong dex:$missing"
            exit 1
          fi
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then echo "::warning title=R8::Bản release vẫn thu gọn mã (có mapping.txt)"; else echo "::notice title=R8::Bản release không thu gọn mã (giữ nguyên lớp MediaPipe)"; fi
          ls build/app/outputs/mapping/release/missing_rules.txt 2>/dev/null && echo "::warning title=R8::$(tr '\n' ' ' < build/app/outputs/mapping/release/missing_rules.txt | cut -c1-1500)" || true
          echo "::notice title=APK::Có mô hình pose (lite, full) và thư viện MediaPipe"
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          cert=$("$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //' || true)
          ver=$("$ANDROID_HOME/build-tools/$bt/aapt2" dump badging "$apk" 2>/dev/null | grep -o "versionCode='[0-9]*'" | head -1 || true)
          echo "::notice title=Chữ ký APK::$ver · chứng chỉ SHA-256 ${cert:0:16}… (giống nhau giữa các bản = cài đè được)"

      - name: Tải APK lên (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: toan-van-dong-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
