name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dart:
    name: Phân tích và test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Phiên bản Flutter
        run: flutter --version

      - name: Thư viện SQLite cho test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 libsqlite3-dev

      - name: Lấy package
        run: flutter pub get

      - name: Kiểm tra định dạng (chỉ cảnh báo)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Phân tích tĩnh
        shell: bash
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          code=$?
          # Mỗi lỗi/cảnh báo thành một annotation để đọc được qua GitHub API
          python3 - <<'PY'
          for line in open('analyze.txt', encoding='utf-8'):
              p = line.rstrip('\n').split('|')
              if len(p) < 8 or p[0] not in ('ERROR', 'WARNING', 'INFO'):
                  continue
              level = {'ERROR': 'error', 'WARNING': 'warning', 'INFO': 'notice'}[p[0]]
              path = p[3].split('/g_primary_math/')[-1]
              msg = '|'.join(p[7:]).replace('%', '%25').replace('\r', '').replace('\n', ' ')
              print(f'::{level} file={path},line={p[4]},col={p[5]},title={p[2]}::{msg}')
          PY
          exit $code

      - name: Unit test
        # Vẫn chạy test khi phân tích tĩnh báo lỗi, để thấy hết vấn đề trong một lần.
        if: success() || failure()
        shell: bash
        run: |
          set +e
          flutter test --file-reporter json:test-results.json --reporter github
          code=$?
          # Mỗi test thất bại thành một annotation có tên test và nội dung lỗi
          python3 - <<'PY'
          import json
          names, errors, prints = {}, {}, {}
          for line in open('test-results.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
              elif e.get('type') == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
          for tid, errs in errors.items():
              # Lỗi widget test (FlutterError) nằm trong phần in ra: lấy đoạn từ "EXCEPTION CAUGHT".
              log = '\n'.join(prints.get(tid, []))
              i = log.find('EXCEPTION CAUGHT')
              detail = log[i:i + 2500] if i >= 0 else ''
              msg = (' / '.join(errs)[:900] + ' || ' + detail).replace('%', '%25').replace('\r', '').replace('\n', ' ¶ ')
              print(f'::error title=TEST {names.get(tid, tid)}::{msg}')
          PY
          exit $code
