name: g_primary_math
description: "Toán Vận Động - game học Toán tiểu học bằng chuyển động, camera điện thoại, phản chiếu lên TV."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0" # Flutter >= 3.27

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/mascot/
    - assets/svg/g7/

  # Font đóng gói trong app (giấy phép OFL, xem assets/fonts/OFL-*.txt),
  # đã cắt chỉ giữ Latin + tiếng Việt để giảm dung lượng.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
